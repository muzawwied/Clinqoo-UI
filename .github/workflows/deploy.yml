name: Deploy Clincoo ke Cloudflare Pages
# Setiap push ke main: deploy versi TERBARU repo ke app.clincoo.buzz.
# Anti nimpa: kalau ada yang deploy dari salinan lama, push berikutnya
# otomatis memulihkan live ke kode main yang benar.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-clincoo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tarik ClincooPay dari build produksi
        run: python3 scripts/strip-clincoopay.py

      - name: Deploy ke Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=clincoo --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Ringkasan
        run: echo "Deploy selesai: $(date -u +'%Y-%m-%d %H:%M UTC') dari commit $GITHUB_SHA"
