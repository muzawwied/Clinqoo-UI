                    Mulai proses konfigurasi untuk mempublikasikan pembaruan terbaru aplikasi Anda ke server publik.
                </p>
                <button onclick="window.location.href='../build-deployment/config/'" class="w-full py-3.5 px-6 bg-gradient-to-r from-gray-900 via-gray-800 to-black text-white rounded-xl font-semibold text-sm hover:from-black hover:to-gray-900 transition-all duration-300 shadow-[0_4px_20px_rgba(0,0,0,0.15)] hover:shadow-[0_6px_24px_rgba(0,0,0,0.25)] flex items-center justify-center gap-3 group border border-gray-800/80 active:scale-[0.99]">
                    <span>Mulai Konfigurasi</span>

    <script>
        // Render Icons Awal
        lucide.createIcons();

        // ===================== DEPLOY ASLI (Cloudflare Pages) =====================
        // API deploy engine: same-origin di Cloudflare Pages; be2 hanya utk GitHub Pages
        // (konsisten dgn dashboard & js/api.js — mencegah data domain terpecah antar backend)
        const API = (['clincoo-be2.pages.dev','localhost','127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://clincoo-be2.pages.dev/api' : '/api';
        const pid = () => localStorage.getItem('clinqoo_current_project_id') || '';
        let deployState = { pages_url: '', pollTimer: null, domainTimer: null, deploying: false };

        // ===================== SESI DEPLOY (klik deploy cukup sekali) =====================
        // Sesi per proyek tersimpan di localStorage: halaman langsung membuka dashboard
        // situs yang sudah dideploy tanpa harus menekan tombol Deploy lagi.
        const DEPLOY_SESSION_KEY = 'clinqoo_deploy_session';
        function readDeploySession() {
            try {
                const ses = JSON.parse(localStorage.getItem(DEPLOY_SESSION_KEY) || 'null');
                return (ses && ses.project_id && ses.project_id === pid()) ? ses : null;
            } catch (e) { return null; }
        }
        function writeDeploySession(patch) {
            try {
                const cur = readDeploySession() || { project_id: pid() };
                localStorage.setItem(DEPLOY_SESSION_KEY, JSON.stringify(Object.assign(cur, patch)));
            } catch (e) {}
        }
        function clearDeploySession() {
            try { localStorage.removeItem(DEPLOY_SESSION_KEY); } catch (e) {}
        }

        async function apiFetch(path, opts = {}) {
            const token = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || '';
            const res = await fetch(API + path, {
                ...opts,
                headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) }
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            return data;
        }

        function timeAgoIso(iso) {
            if (!iso) return 'baru saja';
            const t = new Date(iso + (iso.endsWith('Z') ? '' : 'Z')).getTime();
            return timeAgo(t);
        }

        async function fetchStatus() {
            return apiFetch('/deploy?project_id=' + encodeURIComponent(pid()));
        }

        // Kalau situs sudah aktif / deploy sedang berjalan -> langsung ke dashboard.
        // Selama pengecekan, halaman menampilkan icon loading (view-loading);
        // CTA "Mulai Konfigurasi" hanya muncul jika benar-benar belum ada deployment,
        // jadi user tidak perlu klik konfigurasi ulang setiap kali membuka halaman ini.
        document.addEventListener("DOMContentLoaded", async () => {
            const showCTA = () => {
                const loading = document.getElementById('view-loading');
                if (loading) loading.remove();
                const cta = document.getElementById('view-cta');
                if (cta) cta.classList.remove('hidden');
            };
            // 1) INSTAN dari cache sesi lokal — tampilkan dashboard deploy tanpa
            //    nunggu server. Dulu urutannya kebalik: fetchStatus() jalan duluan,
            //    jadi masuk halaman deployment selalu loading dulu walau sudah deploy.
            const ses = readDeploySession();
            if (ses && (ses.status === 'done' || ses.status === 'deploying')) {
                window.location.replace('../build-deployment/dashboard/');
                return;
            }
            // 2) Tanpa sesi lokal: cek server (deploy dari device lain / cache hilang)
            try {
                const st = await fetchStatus();
                if (st && (st.last_deployment || st.deployed === true || (st.domains || []).length)) {
                    window.location.replace('../build-deployment/dashboard/'); return;
                }
            } catch (e) {}
            showCTA();
        });

    </script>
