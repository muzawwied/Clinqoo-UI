    <script>
        // Render Icons Awal
        lucide.createIcons();

        // ===================== DEPLOY ASLI (Cloudflare Pages) =====================
        // API deploy engine: same-origin di Cloudflare Pages; be2 hanya utk GitHub Pages
        // (konsisten dgn dashboard & js/api.js — mencegah data domain terpecah antar backend)
        const API = (['clincoo-be2.pages.dev','localhost','127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://clincoo-be2.pages.dev/api' : '/api';
        const pid = () => localStorage.getItem('clinqoo_current_project_id') || '';
        let deployState = { pages_url: '', pollTimer: null, domainTimer: null, deploying: false };

        // ===================== SESI DEPLOY (klik deploy cukup sekali) =====================
        // Sesi per proyek tersimpan di localStorage: halaman langsung membuka dashboard
        // situs yang sudah dideploy tanpa harus menekan tombol Deploy lagi.
        const DEPLOY_SESSION_KEY = 'clinqoo_deploy_session';
        function readDeploySession() {
            try {
                const ses = JSON.parse(localStorage.getItem(DEPLOY_SESSION_KEY) || 'null');
                return (ses && ses.project_id && ses.project_id === pid()) ? ses : null;
            } catch (e) { return null; }
        }
        function writeDeploySession(patch) {
            try {
                const cur = readDeploySession() || { project_id: pid() };
                localStorage.setItem(DEPLOY_SESSION_KEY, JSON.stringify(Object.assign(cur, patch)));
            } catch (e) {}
        }
        function clearDeploySession() {
            try { localStorage.removeItem(DEPLOY_SESSION_KEY); } catch (e) {}
        }

        async function apiFetch(path, opts = {}) {
            const token = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || '';
            const res = await fetch(API + path, {
                ...opts,
                headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) }
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            return data;
        }

        function timeAgoIso(iso) {
            if (!iso) return 'baru saja';
            const t = new Date(iso + (iso.endsWith('Z') ? '' : 'Z')).getTime();
            return timeAgo(t);
        }

        async function fetchStatus() {
            return apiFetch('/deploy?project_id=' + encodeURIComponent(pid()));
        }

        // Kalau situs sudah aktif / deploy sedang berjalan -> langsung ke dashboard.
        // Selama pengecekan, halaman menampilkan icon loading (view-loading);
        // CTA "Mulai Konfigurasi" hanya muncul jika benar-benar belum ada deployment,
        // jadi user tidak perlu klik konfigurasi ulang setiap kali membuka halaman ini.
        document.addEventListener("DOMContentLoaded", async () => {
            const showCTA = () => {
                const loading = document.getElementById('view-loading');
                if (loading) loading.remove();
                const cta = document.getElementById('view-cta');
                if (cta) cta.classList.remove('hidden');
            };
            // 1) INSTAN dari cache sesi lokal — tampilkan dashboard deploy tanpa
            //    nunggu server. Dulu urutannya kebalik: fetchStatus() jalan duluan,
            //    jadi masuk halaman deployment selalu loading dulu walau sudah deploy.
            const ses = readDeploySession();
            if (ses && (ses.status === 'done' || ses.status === 'deploying')) {
                window.location.replace('../build-deployment/dashboard/');
                return;
            }
            // 2) Tanpa sesi lokal: cek server (deploy dari device lain / cache hilang)
            try {
                const st = await fetchStatus();
                if (st && (st.last_deployment || st.deployed === true || (st.domains || []).length)) {
                    window.location.replace('../build-deployment/dashboard/'); return;
                }
            } catch (e) {}
            showCTA();
        });

    </script>

            chatNavPill.style.left = el.offsetLeft + 'px';
            chatNavPill.style.width = el.offsetWidth + 'px';
            chatNavPill.style.height = el.offsetHeight + 'px';
        }
        chatNavMovePill(chatNavActive);
        chatNavLinks.forEach(function(l) {
            l.addEventListener('mouseenter', function() { chatNavMovePill(l); });
            l.addEventListener('click', function() { chatNavLinks.forEach(function(x) { x.classList.remove('is-active'); }); l.classList.add('is-active'); chatNavMovePill(l); });
        });
        chatNav.addEventListener('mouseleave', function() { chatNavMovePill(chatNavActive); });
        window.addEventListener('resize', function() { chatNavMovePill(chatNavActive); });
        document.getElementById('sidebar-toggle').addEventListener('click', function() { window.location.href = '/'; });
        var headerMoreBtn = document.getElementById('header-more-btn');
        var headerMoreMenu = document.getElementById('header-more-menu');
        function closeHeaderMenu() { headerMoreMenu.classList.remove('open'); }
        window.toggleHeaderMenu = function(e) {
            e.stopPropagation();
            headerMoreMenu.classList.contains('open') ? closeHeaderMenu() : headerMoreMenu.classList.add('open');
        }
        document.addEventListener('click', function(e) {
            if (headerMoreMenu.classList.contains('open') && !headerMoreMenu.contains(e.target) && e.target !== headerMoreBtn) closeHeaderMenu();
        });
        window.chatExportZip = function() {
            closeHeaderMenu();
            var pid = '';
            try { pid = localStorage.getItem('clinqoo_current_project_id') || ''; } catch (e) {}
            var key = 'clinqoo_workspace_files_' + (pid || 'global');
            var raw = null;
            try { raw = localStorage.getItem(key); } catch (e) {}
            if (!raw) {
                try { var legacy = localStorage.getItem('clinqoo_workspace_files'); if (legacy) { localStorage.setItem(key, legacy); raw = legacy; } } catch (e) {}
            }
            var d = {};
            try { d = JSON.parse(raw) || {}; } catch (e) { d = {}; }
            var files = [];
            Object.keys(d).forEach(function(k) {
                (d[k] || []).forEach(function(it) {
                    if (!it || !it.path || it.type !== 'file') return;
                    files.push({ path: it.path, content: it.content || '' });
                });
            });
            if (!files.length) return;
            var run = function() {
                var zip = new window.JSZip();
                files.forEach(function(f) { zip.file(f.path, f.content || ''); });
                zip.generateAsync({ type: 'blob' }).then(function(blob) {
                    var a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = (pid || 'clincoo') + '.zip';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(function() { URL.revokeObjectURL(a.href); }, 500);
                });
            };
            if (window.JSZip) { run(); return; }
            var sc = document.createElement('script');
            sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
            sc.onload = run;
            document.head.appendChild(sc);
        }
    </script>
</body>
</html>
