<!DOCTYPE html>
<html lang="id">
<head>
<script>(function(){try{var __p=new URLSearchParams(location.search).get('id');if(__p){localStorage.setItem('clinqoo_current_project_id',__p);}}catch(e){}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" sizes="64x64" href="../../assets/favicon.png">
    <link rel="manifest" href="../../manifest.json">
    <title>Code — Clincoo</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#ffffff">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #ffffff; }
        #chat-header-capsule { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        #chat-nav-pill { background: #e9e9ec; }
        .chat-nav-link.is-active { color: #111111; }
        #header-more-menu.open { display: flex; opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
        .header-menu-item { cursor: pointer; }
        body.dark-mode { background: #0a0a0a; }
        body.dark-mode #chat-header-capsule { background-color: #0a0a0a; border-color: rgba(255,255,255,0.15); box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
        body.dark-mode #sidebar-toggle, body.dark-mode #header-more-btn { background-color: #000000; border: 1.5px solid rgba(255,255,255,0.4); color: #ffffff; }
        body.dark-mode #sidebar-toggle:hover, body.dark-mode #header-more-btn:hover { background-color: #1a1a1a; border-color: rgba(255,255,255,0.7); }
        body.dark-mode #sidebar-toggle svg, body.dark-mode #header-more-btn svg { color: #ffffff; stroke: #ffffff; }
        body.dark-mode #chat-nav-pill { background: #232327; }
        body.dark-mode .chat-nav-link { color: #9ca3af; }
        body.dark-mode .chat-nav-link.is-active { color: #ffffff; }
        body.dark-mode #header-more-menu { background-color: #0a0a0a; border-color: rgba(255,255,255,0.15); }
        body.dark-mode .header-menu-item { color: #e5e7eb; }
        body.dark-mode .header-menu-item:hover { background-color: #1a1a1a; color: #ffffff; }
        body.dark-mode .header-menu-item svg { color: #9ca3af; }
        body.dark-mode .code-row { background-color: #0a0a0a; border-color: rgba(255,255,255,0.1); }
        body.dark-mode .code-row:hover { border-color: rgba(255,255,255,0.25); }
        body.dark-mode .code-row-name { color: #e5e7eb; }
        body.dark-mode .code-row-path { color: #6b7280; }
    </style>
</head>
<body class="min-h-screen">
    <header class="fixed top-0 left-0 right-0 z-30 px-3 pt-3 pointer-events-none flex justify-between items-center">
        <button id="sidebar-toggle" type="button" class="pointer-events-auto flex-shrink-0 flex items-center justify-center text-[#222222] bg-white hover:text-black hover:bg-gray-100 transition-all rounded-full w-11 h-11" aria-label="Kembali ke Beranda">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        <div class="pointer-events-auto inline-flex items-center gap-1 bg-white shadow-[0_4px_24px_rgba(0,0,0,0.10)] border border-gray-100/80 rounded-full pl-1.5 pr-1.5 py-1.5" id="chat-header-capsule">
            <nav id="chat-top-nav" class="relative inline-flex items-center p-1">
                <div id="chat-nav-pill" class="absolute bg-gray-100 rounded-full pointer-events-none transition-all duration-300 ease-out" style="top:0;left:0;width:0;height:0"></div>
                <a href="/proyek/chat/" data-nav="agent" class="chat-nav-link relative z-10 px-4 py-2 rounded-full text-sm font-semibold text-gray-500 hover:text-gray-800 whitespace-nowrap transition-colors">Agent</a>
                <a href="/proyek/code/" data-nav="code" class="chat-nav-link relative z-10 px-4 py-2 rounded-full text-sm font-semibold text-gray-800 whitespace-nowrap transition-colors">Code</a>
                <a href="/proyek/dashboard/" data-nav="dashboard" class="chat-nav-link relative z-10 px-4 py-2 rounded-full text-sm font-semibold text-gray-500 hover:text-gray-800 whitespace-nowrap transition-colors">Dashboard</a>
            </nav>
        </div>
        <div class="relative flex-shrink-0 pointer-events-auto">
                <button id="header-more-btn" type="button" onclick="toggleHeaderMenu(event)" class="w-11 h-11 rounded-full flex items-center justify-center text-[#222222] bg-white hover:bg-gray-100 hover:text-black transition-all" aria-label="Menu lainnya">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle>
                    </svg>
                </button>
                <div id="header-more-menu" class="absolute top-full right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-gray-100 p-1.5 flex-col gap-0.5 opacity-0 invisible translate-y-1 pointer-events-none transition-all duration-200 z-50 hidden">
                    <a href="/proyek/workspace/editor/" class="header-menu-item flex items-center gap-3 px-3 py-2.5 hover:bg-gray-50 rounded-lg transition-colors text-sm font-medium text-gray-800 text-left">
                        <svg class="w-4 h-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2 12a10 10 0 1 0 20 0 10 10 0 0 0-20 0M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"></path></svg>
                        Live preview
                    </a>
                    <button id="header-export-zip" type="button" onclick="chatExportZip()" class="header-menu-item w-full flex items-center gap-3 px-3 py-2.5 hover:bg-gray-50 rounded-lg transition-colors text-sm font-medium text-gray-800 text-left">
                        <svg class="w-4 h-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
                        Eksport zip
                    </button>
                    <a href="/integrasi/github/" class="header-menu-item flex items-center gap-3 px-3 py-2.5 hover:bg-gray-50 rounded-lg transition-colors text-sm font-medium text-gray-800 text-left">
                        <svg class="w-4 h-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path stroke-linecap="round" stroke-linejoin="round" d="M9 18c-4.51 2-5-2-7-2"></path></svg>
                        Koneksi git
                    </a>
                    <a href="/akun/tentang/" class="header-menu-item flex items-center gap-3 px-3 py-2.5 hover:bg-gray-50 rounded-lg transition-colors text-sm font-medium text-gray-800 text-left">
                        <svg class="w-4 h-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path stroke-linecap="round" stroke-linejoin="round" d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"></path></svg>
                        Pusat bantuan
                    </a>
                </div>
            </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 pt-[92px] pb-16">
        <div class="mb-6">
            <h1 class="text-xl font-bold text-gray-900" id="page-title">Code</h1>
            <p class="text-sm text-gray-500 mt-1" id="page-subtitle">Daftar code proyek aktif</p>
        </div>
        <div id="file-list" class="flex flex-col gap-2"></div>
    </main>

    <script>
        var currentProjectId = (function(){ try { return localStorage.getItem('clinqoo_current_project_id') || ''; } catch(e) { return ''; } })();
        function wsFilesKey() { return 'clinqoo_workspace_files_' + (currentProjectId || 'global'); }
        function wsLoad() {
            try {
                var raw = localStorage.getItem(wsFilesKey());
                if (!raw) {
                    var legacy = localStorage.getItem('clinqoo_workspace_files');
                    if (legacy) { localStorage.setItem(wsFilesKey(), legacy); raw = legacy; }
                }
                var d = JSON.parse(raw);
                if (d && typeof d === 'object') return d;
            } catch (e) {}
            return {};
        }
        function wsFlatten(data) {
            var files = [];
            Object.keys(data || {}).forEach(function(k) {
                (data[k] || []).forEach(function(it) {
                    if (!it || !it.path) return;
                    if (it.type === 'file') files.push({ path: it.path, content: it.content || '' });
                    else {
                        var hasChildren = Object.keys(data).some(function(x) { return x === it.path || x.indexOf(it.path + '/') === 0; });
                        if (!hasChildren) files.push({ path: it.path + '/', content: '', folder: true });
                    }
                });
            });
            return files;
        }
        function wsProjectId() { return currentProjectId || ''; }
        function projectName() {
            try {
                var list = JSON.parse(localStorage.getItem('clinqoo_projects') || '[]');
                for (var i = 0; i < list.length; i++) { if (String(list[i].id) === String(currentProjectId)) return list[i].title || list[i].aiName || ('Proyek ' + currentProjectId); }
            } catch (e) {}
            try {
                var uc = JSON.parse(localStorage.getItem('clinqoo_umum_' + currentProjectId) || '{}');
                if (uc && uc.app_name) return uc.app_name;
            } catch (e) {}
            return 'Proyek aktif';
        }
        function fmtSize(n) {
            if (n < 1024) return n + ' B';
            if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
            return (n / 1048576).toFixed(1) + ' MB';
        }
        function iconFor(path) {
            var ext = path.split('.').pop().toLowerCase();
            var stroke = 'stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
            if (path.charAt(path.length - 1) === '/') return '<svg class="w-4 h-4 text-gray-400 shrink-0" ' + stroke + '><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>';
            if (ext === 'html' || ext === 'htm') return '<svg class="w-4 h-4 text-orange-500 shrink-0" ' + stroke + '><path d="m10 20-2-2 2-2M14 4l2 2-2 2"/><path d="M4 12h16"/><rect x="2" y="8" width="4" height="8" rx="1"/><rect x="18" y="8" width="4" height="8" rx="1"/></svg>';
            if (ext === 'css') return '<svg class="w-4 h-4 text-blue-500 shrink-0" ' + stroke + '><circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/></svg>';
            if (ext === 'js' || ext === 'json') return '<svg class="w-4 h-4 text-yellow-500 shrink-0" ' + stroke + '><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 4l-4 16"/></svg>';
            if (ext === 'md') return '<svg class="w-4 h-4 text-gray-500 shrink-0" ' + stroke + '><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>';
            if (['png','jpg','jpeg','svg','webp','gif','ico'].indexOf(ext) !== -1) return '<svg class="w-4 h-4 text-green-500 shrink-0" ' + stroke + '><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>';
            return '<svg class="w-4 h-4 text-gray-400 shrink-0" ' + stroke + '><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>';
        }
        function renderFiles() {
            var list = document.getElementById('file-list');
            var files = wsFlatten(wsLoad()).sort(function(a, b) { return a.path.localeCompare(b.path); });
            document.getElementById('page-subtitle').textContent = files.length ? files.length + ' file · ' + projectName() : 'Belum ada file';
            if (!files.length) {
                list.innerHTML = '<div class="rounded-2xl border border-gray-100 px-5 py-10 text-center text-sm text-gray-400">Belum ada file di proyek ini.<br>Buat lewat Agent atau Editor.</div>';
                return;
            }
            list.innerHTML = files.map(function(f) {
                var size = f.folder ? 'Folder' : fmtSize((f.content || '').length);
                var name = f.path.replace(/\/$/, '').split('/').pop() || f.path;
                return '<a href="/proyek/workspace/editor/" class="code-row flex items-center gap-3 rounded-2xl border border-gray-100 px-4 py-3.5 hover:border-gray-200 hover:bg-gray-50/50 transition-all">' + iconFor(f.path) +
                    '<span class="min-w-0 flex-1"><span class="code-row-name block text-sm font-semibold text-gray-800 truncate">' + name + '</span>' +
                    '<span class="code-row-path block text-xs text-gray-400 truncate">' + f.path + '</span></span>' +
                    '<span class="text-xs text-gray-400 shrink-0">' + size + '</span></a>';
            }).join('');
        }
        renderFiles();

        var chatNav = document.getElementById('chat-top-nav');
        var chatNavPill = document.getElementById('chat-nav-pill');
        var chatNavLinks = Array.prototype.slice.call(chatNav.querySelectorAll('.chat-nav-link'));
        var chatNavActive = chatNavLinks.filter(function(l) { return l.dataset.nav === 'code'; })[0] || chatNavLinks[0];
        if (chatNavActive) chatNavActive.classList.add('is-active');
        function chatNavMovePill(el) {
            if (!el) return;
            chatNavPill.style.top = el.offsetTop + 'px';
            chatNavPill.style.left = el.offsetLeft + 'px';
            chatNavPill.style.width = el.offsetWidth + 'px';
            chatNavPill.style.height = el.offsetHeight + 'px';
        }
        chatNavMovePill(chatNavActive);
        chatNavLinks.forEach(function(l) {
            l.addEventListener('mouseenter', function() { chatNavMovePill(l); });
            l.addEventListener('click', function() { chatNavLinks.forEach(function(x) { x.classList.remove('is-active'); }); l.classList.add('is-active'); chatNavMovePill(l); });
        });
        chatNav.addEventListener('mouseleave', function() { chatNavMovePill(chatNavActive); });
        window.addEventListener('resize', function() { chatNavMovePill(chatNavActive); });

        document.getElementById('sidebar-toggle').addEventListener('click', function() { window.location.href = '/'; });
        var headerMoreBtn = document.getElementById('header-more-btn');
        var headerMoreMenu = document.getElementById('header-more-menu');
        function closeHeaderMenu() { headerMoreMenu.classList.remove('open'); }
        window.toggleHeaderMenu = function(e) {
            e.stopPropagation();
            headerMoreMenu.classList.contains('open') ? closeHeaderMenu() : headerMoreMenu.classList.add('open');
        }
        document.addEventListener('click', function(e) {
            if (headerMoreMenu.classList.contains('open') && !headerMoreMenu.contains(e.target) && e.target !== headerMoreBtn) closeHeaderMenu();
        });
        window.chatExportZip = function() {
            closeHeaderMenu();
            var files = wsFlatten(wsLoad());
            if (!files || !files.length) return;
            var run = function() {
                var zip = new window.JSZip();
                files.forEach(function(f) { zip.file(f.path, f.content || ''); });
                zip.generateAsync({ type: 'blob' }).then(function(blob) {
                    var a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = (wsProjectId() || 'clincoo') + '.zip';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(function() { URL.revokeObjectURL(a.href); }, 500);
                });
            };
            if (window.JSZip) { run(); return; }
            var sc = document.createElement('script');
            sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
            sc.onload = run;
            document.head.appendChild(sc);
        }
        if ('serviceWorker' in navigator) { window.addEventListener('load', function() { navigator.serviceWorker.register('../../sw.js').catch(function() {}); }); }
    </script>
</body>
</html>
